<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Alumni–Student Connect</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
   <nav class="navbar">

  <div class="logo-box">
    <img src="logo.jpeg" alt="MentiCircle Logo">
    <div class="logo-text">
      <h2>MentiCircle</h2>
      <span>Learn • Mentor • Grow</span>
    </div>
  </div>

</nav>
  <div class="login-container">

    <div class="login-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Login to Alumni–Student Connect</p>

      <form>
        <input type="email" placeholder="Email address" required>
        <input type="password" placeholder="Password" required>

        <button type="submit" class="login-btn">
          <a href="dashboard.html">Login</a></button>
      </form>

      <div class="divider">
        <span>OR</span>
      </div>
           
      <button class="google-btn">
        <i class="fa-brands fa-google"></i>
        Login with Google
        <a href="dashboard.html"></a>
      </button>

      <p class="signup-text">
        New user?
        <a href="signup.html">Sign up</a>
      </p>
    </div>

  </div>

</body>
</html>
